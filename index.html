  <style>
    :root {
      --navy: #062464;
      --navy-deep: #0F2557;
      --navy-dark: #041845;
      --gold: #EAAA01;
      --gold-warm: #b88b32;
      --gold-deep: #C98F0C;
      --ink: #10182f;
      --ink-body: #384765;
      --ink-soft: #4A5872;
      --surface-white: #ffffff;
      --surface-cool: #f4f5fa;
      --surface-paper: #F5F1EA;
      --border: #dce2ee;
      --rule: rgba(15, 37, 87, 0.14);
      --radius: 10px;
      --shadow: 0 10px 28px rgba(6, 36, 100, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink-body);
      background-color: var(--surface-white);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Top Utility Bar */
    .top-bar {
      background: var(--navy-dark);
      color: rgba(255, 255, 255, 0.86);
      font-family: 'Montserrat', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .top-bar .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Main Header */
    header.site-header {
      background: var(--navy);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    }

    .nav-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #ffffff;
    }

    .brand-logo-wrap {
      background: #ffffff;
      padding: 5px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
    }

    .brand-logo-wrap img {
      max-height: 34px;
      width: auto;
      display: block;
    }

    .brand-text {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 15px;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .brand-text span {
      display: block;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--gold);
      text-transform: none;
      letter-spacing: 0;
      margin-top: 2px;
    }

    nav.main-nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav.main-nav a {
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      transition: color 0.2s ease;
    }

    nav.main-nav a:hover {
      color: var(--gold);
    }

    /* Official FFCDC Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 24px;
      border-radius: 7px;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      line-height: 1;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
      text-align: center;
    }

    .btn-gold {
      background: var(--gold);
      color: var(--navy);
      border-color: var(--gold);
    }

    .btn-gold:hover {
      background: #ffffff;
      border-color: #ffffff;
      color: var(--navy);
      transform: translateY(-2px);
    }

    .btn-navy {
      background: var(--navy);
      color: #ffffff;
      border-color: var(--navy);
    }

    .btn-navy:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy);
      transform: translateY(-2px);
    }

    .btn-outline-white {
      background: transparent;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.75);
    }

    .btn-outline-white:hover {
      background: #ffffff;
      border-color: #ffffff;
      color: var(--navy);
      transform: translateY(-2px);
    }

    .btn-outline-navy {
      background: #ffffff;
      color: var(--navy);
      border-color: var(--border);
    }

    .btn-outline-navy:hover {
      border-color: var(--navy);
      background: var(--surface-cool);
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #041845 0%, #062464 60%, #0F2557 100%);
      color: #ffffff;
      padding: 82px 0 80px;
      position: relative;
      overflow: hidden;
    }

    .hero-box {
      max-width: 820px;
      position: relative;
      z-index: 2;
    }

    .hero-kicker {
      color: var(--gold);
      font-family: 'Poppins', sans-serif;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 2.4px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 20px;
      display: block;
    }

    .hero h1 {
      color: #ffffff;
      font-size: clamp(38px, 5vw, 58px);
      line-height: 1.08;
      font-weight: 900;
      letter-spacing: -1.2px;
      margin-bottom: 22px;
    }

    .hero p {
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      font-size: 16.5px;
      line-height: 1.55;
      font-weight: 500;
      max-width: 680px;
      margin-bottom: 34px;
      opacity: 0.94;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 42px;
    }

    .hero-stats {
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      padding-top: 24px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
    }

    .hero-stat-number {
      color: var(--gold);
      font-family: 'Poppins', sans-serif;
      font-size: 24px;
      line-height: 1.1;
      font-weight: 800;
